<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Request portal access — Carry Forward</title>
<style>
/* Self-contained on purpose: the rest of the site sits behind sign-in, so this page loads nothing from it. */
:root{
  --navy:#0E263C; --navy-700:#1A3755; --gold:#AD8B5A; --gold-light:#D4B583; --gold-deep:#8A6B3E;
  --ground:#FFFFFF; --panel:#F8F7F4; --ink:#0E263C; --muted:#5B6A7A;
  --rule:#DDE2E8; --field:#7F8C9A; --drag:#8A3B2C;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(14,38,60,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.w{max-width:1060px;margin:0 auto;padding:0 24px}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.012em;margin:0;color:var(--navy)}
h1{font-size:clamp(30px,4.9vw,47px);line-height:1.1}
p{margin:0 0 15px}
.muted{color:var(--muted)}

header{border-bottom:1px solid var(--rule);background:rgba(255,255,255,.93)}
.nav{display:flex;align-items:center;height:72px}
.wm{font-family:var(--serif);font-size:19px;line-height:1;letter-spacing:.055em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.wm i{font-style:normal;color:var(--gold)}
@media(max-width:620px){.nav{height:64px}.wm{font-size:16px}}

.hero{padding:76px 0 62px;border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#FAF9F6 0%,#FFFFFF 82%)}
.hero p.lede{font-size:19px;color:var(--muted);max-width:56ch;margin-top:20px;margin-bottom:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:15px}
section{padding:64px 0}
.narrow{max-width:760px}

form{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:28px;box-shadow:var(--shadow)}
.fg{margin-bottom:15px}
label{display:block;font-size:13.5px;margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--field);border-radius:2px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:2px;border-color:var(--navy)}
textarea{min-height:92px;resize:vertical}
@media(max-width:700px){input,textarea{font-size:16px}}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:12px 22px;border-radius:2px;
  font-size:14.5px;border:1px solid var(--navy);cursor:pointer;font-family:inherit;transition:background .18s,border-color .18s}
.btn:hover{background:var(--navy-700);border-color:var(--navy-700)}
.btn[aria-disabled="true"]{opacity:.65;cursor:progress}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
#sent{margin:14px 0 0}
#sent:empty{margin:0}
#sent:focus{outline:none}

footer{background:var(--navy);color:#9FB0C1;padding:46px 0;font-size:13.5px}
footer p{max-width:86ch;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="w nav">
    <span class="wm">Carry<i>&nbsp;Forward</i></span>
  </div>
</header>

<main id="content">
  <div class="hero">
    <div class="w">
      <div class="eyebrow">Advisor portal</div>
      <h1>Request portal access</h1>
      <p class="lede">The portal is for engagement clients, and access is issued by email after review.</p>
    </div>
  </div>

  <section>
    <div class="w narrow">
      <form id="req" method="POST">
        <input type="hidden" name="source" value="portal-request" />
        <div class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="company" tabindex="-1" autocomplete="off" /></label></div>
        <div class="fg"><label for="n">Name (required)</label><input id="n" name="name" autocomplete="name" required /></div>
        <div class="fg"><label for="e">Email (required)</label><input id="e" name="email" type="email" autocomplete="email" required /></div>
        <div class="fg"><label for="p">Phone (required)</label><input id="p" name="phone" type="tel" autocomplete="tel" required /></div>
        <div class="fg"><label for="f">Firm (optional)</label><input id="f" name="firm" autocomplete="organization" /></div>
        <div class="fg"><label for="u">What would you like to use it for</label><textarea id="u" name="use"></textarea></div>
        <button class="btn" type="submit">Request access</button>
        <p id="sent" class="muted" role="status" tabindex="-1" data-ok="Thank you. I review each request and will email you if access is available."></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="w">
    <p>Nothing on this site is investment, legal or tax advice, and no tool here is an appraisal.</p>
    <p>&copy; <span id="yr"></span> Carry Forward.</p>
  </div>
</footer>

<script>
(function () {
  'use strict';
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Same value as FORM_ENDPOINT in assets/site.js. While it holds the placeholder the form refuses to
  // send, so a thank-you can never be shown for a request that went nowhere.
  var FORM_ENDPOINT = 'https://formspree.io/f/REPLACE_ME';

  var form = document.getElementById('req');
  var sending = false;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (sending) return;
    var btn = form.querySelector('button[type="submit"]');
    var s = document.getElementById('sent');
    var okText = s.getAttribute('data-ok') || '';
    var fail = function (text) { s.textContent = text; s.focus(); };
    var data = {};
    new FormData(form).forEach(function (value, key) { data[key] = value; });

    if (FORM_ENDPOINT.indexOf('REPLACE_ME') !== -1) {
      fail('This form is not connected yet, so your request was not sent. Please email me directly instead.');
      return;
    }
    // a person never sees the honeypot field, so anything in it means a bot and nothing is sent
    if (data.company) {
      fail('Your request did not send. Please email me directly instead.');
      return;
    }
    delete data.company;

    sending = true;
    btn.setAttribute('aria-disabled', 'true');
    btn.textContent = 'Sending…';
    s.textContent = '';

    fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(data)
    })
      .then(function (res) {
        // res.ok is true only for a 2xx response; anything else is treated as not sent
        if (!res.ok) throw new Error('send failed');
        form.reset();
        s.textContent = okText;
      })
      .catch(function () {
        s.textContent = 'Your request did not send. Please email me directly instead.';
      })
      .finally(function () {
        sending = false;
        btn.removeAttribute('aria-disabled');
        btn.textContent = 'Request access';
        s.focus();
      });
  });
})();
</script>
</body>
</html>
